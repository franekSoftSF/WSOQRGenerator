<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR code appearance — Android Enrollment QR Generator</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<style>
  :root {
    --ink: #1e1b2e;
    --muted: #6b6880;
    --line: #e4e0f0;
    --surface: #ffffff;
    --bg: #f7f6fb;
    --accent: #5b12d4;
    --accent-soft: #8b5cf6;
    --accent-wash: #f1ecfe;
    --danger: #c0392b;
    --ok: #1f9d55;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0; padding: 30px 20px 46px;
    font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
    color: var(--ink); background: var(--bg); line-height: 1.5;
  }

  .page { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

  .topbar { display: flex; gap: 20px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
  .brand { display: flex; gap: 12px; align-items: flex-start; }
  .brand img { width: 44px; height: 44px; border-radius: 8px; flex: none; }
  .topbar h1 { margin: 0 0 6px; font-size: 22px; }
  .topbar p { margin: 0; color: var(--muted); font-size: 14px; max-width: 640px; }
  .lang { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  .lang select { min-width: 130px; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; }
  .card h2 {
    margin: 0 0 14px; font-size: 12px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.04em; color: var(--muted);
  }

  .split { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 18px; align-items: start; }
  @media (max-width: 820px) { .split { grid-template-columns: minmax(0, 1fr); } }

  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px 16px; }
  label.field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }

  input[type="text"], input[type="color"], input[type="range"], select {
    font: inherit; font-size: 14px; color: var(--ink); background: var(--surface);
    border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; width: 100%;
  }
  input[type="range"] { padding: 0; }

  .btn {
    font: inherit; font-size: 14px; border: 1px solid var(--line); border-radius: 6px;
    padding: 8px 14px; background: var(--surface); color: var(--ink); cursor: pointer;
  }
  .btn--primary { background: linear-gradient(135deg, var(--accent), var(--accent-soft)); border-color: var(--accent); color: #fff; }

  .hint { font-size: 12.5px; color: var(--muted); margin: 6px 0 0; }
  .hint--warn { color: var(--danger); }
  .hint--ok { color: var(--ok); }

  .preview { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  /* Displayed at exactly half the rendered size: an integer ratio, so the modules stay crisp
     instead of being smeared by the browser resampling 1024 down to something like 320. */
  .preview canvas { border: 1px solid var(--line); border-radius: 8px; background: #fff; width: 512px; max-width: 100%; height: auto; aspect-ratio: 1 / 1; }

  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  footer { font-size: 13px; color: var(--muted); text-align: center; }
  a { color: var(--accent); }
</style>
</head>
<body>
<div class="page">

  <div class="topbar">
    <div class="brand">
      <img src="logo.png" alt="WSO QR">
      <div>
        <h1 data-i18n="customTitle"></h1>
        <p data-i18n="customIntro"></p>
      </div>
    </div>
    <label class="lang">
      <span data-i18n="langLabel"></span>
      <select id="langSelect"></select>
    </label>
  </div>

  <div class="split">
    <section class="card">
      <h2 data-i18n="qrCustomTitle"></h2>

      <div class="grid2">
        <label class="field"><span data-i18n="qrColorLabel"></span>
          <input type="color" id="qrColor" value="#1e1b2e">
        </label>
        <label class="field"><span data-i18n="qrLogoLabel"></span>
          <select id="qrLogoMode">
            <option value="none" data-i18n="qrLogoNone"></option>
            <option value="builtin" data-i18n="qrLogoBuiltin"></option>
            <option value="own" data-i18n="qrLogoOwn"></option>
          </select>
        </label>
      </div>
      <input type="file" id="qrLogoFile" accept="image/*" hidden>

      <label class="field" style="margin-top:12px; max-width:320px;">
        <span><span data-i18n="customSize"></span> <strong id="sizeValue"></strong></span>
        <input type="range" id="logoScale" min="8" max="28" step="1" value="18">
      </label>

      <p class="hint" data-i18n="qrCustomNote"></p>

      <div class="actions" style="margin-top:14px;">
        <button class="btn btn--primary" id="saveBtn" data-i18n="customSave"></button>
        <button class="btn" id="resetBtn" data-i18n="customReset"></button>
        <a class="btn" href="index.html" data-i18n="customBack"></a>
      </div>
      <p class="hint" id="saveNote"></p>
    </section>

    <aside class="card">
      <h2 data-i18n="customPreview"></h2>
      <div class="preview">
        <canvas id="previewCanvas"></canvas>
        <p class="hint" id="verdict" style="text-align:center; margin:0;"></p>
      </div>
      <p class="hint" data-i18n="customPreviewNote"></p>
    </aside>
  </div>

  <footer>
    <a href="index.html" data-i18n="customBack"></a> ·
    <a href="https://github.com/franekSoftSF/WSOQRGenerator" rel="noopener">source</a>
  </footer>
</div>

<script src="qrcode.min.js"></script>
<script src="jsqr.min.js"></script>
<script src="i18n.js"></script>
<script src="style-store.js"></script>
<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var LANG_KEY = 'enrollment-qr-lang';
  var lang = 'en';
  var logoImage = null;

  function t(key) {
    var dict = window.QR_I18N[lang] || {};
    return dict[key] !== undefined ? dict[key] : window.QR_I18N.en[key];
  }

  // A payload of realistic length - a preview built from three short fields would look fine
  // and then fall apart on a real code, which is exactly the failure this page must prevent.
  var SAMPLE = JSON.stringify({
    'android.app.extra.PROVISIONING_DEVICE_ADMIN_COMPONENT_NAME': 'com.airwatch.androidagent/com.airwatch.agent.DeviceAdministratorReceiver',
    'android.app.extra.PROVISIONING_DEVICE_ADMIN_SIGNATURE_CHECKSUM': '6kyqxDOjgS30jvQuzh4uvHPk-0bmAD-1QU7vtW7i_o8=\n',
    'android.app.extra.PROVISIONING_DEVICE_ADMIN_PACKAGE_DOWNLOAD_LOCATION': 'https://play.google.com/managed/downloadManagingApp?identifier=hub',
    'android.app.extra.PROVISIONING_ADMIN_EXTRAS_BUNDLE': {
      serverurl: 'ds2060.awmdm.com',
      gid: 'PDA_WAREHOUSE',
      un: 'pda_user19',
      pw: 'Kq7tRv2Ns8wZp4Xj6Ld3Mn5',
      useUEMAuthentication: 'true',
      enable3rdPartyCookiesInVIDM: 'false'
    },
    'android.app.extra.PROVISIONING_LOCALE': 'pl_PL',
    'android.app.extra.PROVISIONING_TIME_ZONE': 'Europe/Warsaw'
  });

  function render() {
    var style = {
      color: $('qrColor').value,
      logoScale: Number($('logoScale').value),
      logoMode: $('qrLogoMode').value
    };
    $('sizeValue').textContent = style.logoScale + '%';

    var canvas = $('previewCanvas');
    QRCode.toCanvas(canvas, SAMPLE, {
      width: 1024,
      margin: 4,
      errorCorrectionLevel: logoImage ? 'H' : 'M',
      color: { dark: style.color, light: '#ffffff' }
    }, function (err) {
      if (err) { return; }

      if (logoImage) {
        var ctx = canvas.getContext('2d');
        var size = Math.round(canvas.width * (style.logoScale / 100));
        var pad = Math.round(size * 0.12);
        var x = Math.round((canvas.width - size) / 2);
        var y = Math.round((canvas.height - size) / 2);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(x - pad, y - pad, size + pad * 2, size + pad * 2);
        var ratio = Math.min(size / logoImage.naturalWidth, size / logoImage.naturalHeight);
        var w = logoImage.naturalWidth * ratio;
        var h = logoImage.naturalHeight * ratio;
        ctx.drawImage(logoImage, x + (size - w) / 2, y + (size - h) / 2, w, h);
      }

      canvas.style.width = '';
      canvas.style.height = '';

      // The same check the generator runs on the real code: read it back and say so.
      try {
        var px = canvas.getContext('2d').getImageData(0, 0, canvas.width, canvas.height);
        var ok = !!window.jsQR(px.data, px.width, px.height);
        $('verdict').textContent = ok ? t('qrReadable') : t('qrUnreadable');
        $('verdict').className = 'hint ' + (ok ? 'hint--ok' : 'hint--warn');
      } catch (e) { $('verdict').textContent = ''; }
    });
  }

  function setLogo(src, then) {
    if (!src) { logoImage = null; render(); if (then) { then(); } return; }
    var image = new Image();
    image.onload = function () { logoImage = image; render(); if (then) { then(); } };
    image.onerror = function () { logoImage = null; render(); };
    image.src = src;
  }

  function applyStyle(style) {
    $('qrColor').value = style.color;
    $('logoScale').value = style.logoScale;
    $('qrLogoMode').value = style.logoMode;
    setLogo(style.logoMode === 'none' ? null : (style.logoMode === 'builtin' ? 'logo.png' : style.logoData));
  }

  function currentStyle() {
    return {
      color: $('qrColor').value,
      logoScale: Number($('logoScale').value),
      logoMode: $('qrLogoMode').value,
      logoData: $('qrLogoMode').value === 'own' && logoImage ? logoImage.src : ''
    };
  }

  function initLanguage() {
    var select = $('langSelect');
    Object.keys(window.QR_I18N).forEach(function (code) {
      var opt = document.createElement('option');
      opt.value = code;
      opt.textContent = window.QR_I18N[code]._name;
      select.appendChild(opt);
    });

    var saved = null;
    try { saved = localStorage.getItem(LANG_KEY); } catch (e) { saved = null; }
    var browser = (navigator.language || 'en').split('-')[0].toLowerCase();
    lang = (saved && window.QR_I18N[saved]) ? saved : (window.QR_I18N[browser] ? browser : 'en');
    select.value = lang;

    select.addEventListener('change', function () {
      lang = select.value;
      try { localStorage.setItem(LANG_KEY, lang); } catch (e) { /* private mode */ }
      applyLanguage();
    });
  }

  function applyLanguage() {
    document.documentElement.lang = lang;
    Array.prototype.forEach.call(document.querySelectorAll('[data-i18n]'), function (el) {
      el.textContent = t(el.getAttribute('data-i18n'));
    });
    document.title = t('customTitle') + ' — Android Enrollment QR Generator';
    render();
  }

  $('qrColor').addEventListener('input', render);
  $('logoScale').addEventListener('input', render);

  $('qrLogoMode').addEventListener('change', function () {
    var mode = $('qrLogoMode').value;
    if (mode === 'none') { setLogo(null); }
    else if (mode === 'builtin') { setLogo('logo.png'); }
    else { $('qrLogoFile').click(); }
  });

  $('qrLogoFile').addEventListener('change', function (e) {
    var file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) { $('qrLogoMode').value = logoImage ? 'own' : 'none'; return; }
    var reader = new FileReader();
    reader.onload = function () { setLogo(String(reader.result)); };
    reader.readAsDataURL(file);
  });

  $('saveBtn').addEventListener('click', function () {
    window.QR_STYLE.save(currentStyle());
    $('saveNote').textContent = t('customSaved');
    $('saveNote').className = 'hint hint--ok';
  });

  $('resetBtn').addEventListener('click', function () {
    window.QR_STYLE.clear();
    applyStyle(window.QR_STYLE.defaults());
    $('saveNote').textContent = t('customReset0');
    $('saveNote').className = 'hint';
  });

  initLanguage();
  applyStyle(window.QR_STYLE.load());
  applyLanguage();
})();
</script>
</body>
</html>
